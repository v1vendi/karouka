<svg xmlns="http://www.w3.org/2000/svg" width="90" height="90" viewBox="0 0 90 90" shape-rendering="crispEdges">
  <!-- Nine 30x30 cells, each its own colours, so a slice drawn in the wrong place, transposed or
       mirrored shows. Edges split along their run (top/bottom left|right, left/right top|bottom),
       so the tiling of each edge shows; the centre is four quadrants. -->
  <rect x="0" y="0" width="30" height="30" fill="#c00000"/>
  <rect x="60" y="0" width="30" height="30" fill="#00a000"/>
  <rect x="0" y="60" width="30" height="30" fill="#0000c0"/>
  <rect x="60" y="60" width="30" height="30" fill="#c0c000"/>
  <rect x="30" y="0" width="15" height="30" fill="#ff8000"/>
  <rect x="45" y="0" width="15" height="30" fill="#800080"/>
  <rect x="30" y="60" width="15" height="30" fill="#008080"/>
  <rect x="45" y="60" width="15" height="30" fill="#ff00ff"/>
  <rect x="0" y="30" width="30" height="15" fill="#804000"/>
  <rect x="0" y="45" width="30" height="15" fill="#00ffff"/>
  <rect x="60" y="30" width="30" height="15" fill="#404040"/>
  <rect x="60" y="45" width="30" height="15" fill="#ffc0c0"/>
  <rect x="30" y="30" width="15" height="15" fill="#000000"/>
  <rect x="45" y="30" width="15" height="15" fill="#80ff80"/>
  <rect x="30" y="45" width="15" height="15" fill="#8080ff"/>
  <rect x="45" y="45" width="15" height="15" fill="#ffffff"/>
</svg>
