<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="karouka-check-title" content="^icu ok$">
<title>pending</title>
<style>
  /* karouka's own page: libicudata keeps only root and English locale data plus the
     locale-independent data (segmentation rules and the Thai/Lao/Khmer/Burmese dictionaries,
     NFKC and UTS #46, the collation root, time zones, plurals). Other locales fall back to the
     default locale without throwing and format as English; Turkish, Azeri, Lithuanian and Greek
     keep their main locale data for their case mappings. The title lists every failed check. */
  body { margin: 0; background: rgb(28, 32, 40); color: rgb(220, 220, 220); font: 20px sans-serif; }
  #result { margin: 20px; padding: 16px; border-radius: 8px; background: rgb(120, 40, 40); white-space: pre-wrap; }
  #result.ok { background: rgb(40, 110, 60); }
  .probe { position: absolute; top: 300px; white-space: nowrap; }
</style>
</head>
<body>
<div id="result">running</div>
<span class="probe" id="halfwidth">ABC 123</span>
<span class="probe" id="fullwidth" style="text-transform: full-width">ABC 123</span>
<span class="probe" id="fullwidth_mixed" style="text-transform: full-width">A b¥ｶﾞﾊﾟｱﾡ!</span>
<script>
  const failures = [];
  const check = (what, ok) => { try { if (!ok()) failures.push(what); } catch (e) { failures.push(what + " threw " + e); } };
  const fallback = new Intl.NumberFormat().resolvedOptions().locale;

  // Dropped locales: no throw, the default locale, English formatting.
  check("de-DE NumberFormat", () => {
    const format = new Intl.NumberFormat("de-DE");
    return format.resolvedOptions().locale === fallback && format.format(1234.5) === "1,234.5";
  });
  check("toLocaleString de-DE", () => (1234.5).toLocaleString("de-DE") === "1,234.5");
  check("fr-FR DateTimeFormat", () =>
      new Intl.DateTimeFormat("fr-FR", { timeZone: "UTC" }).format(Date.UTC(2020, 0, 2)) === "1/2/2020");
  check("supportedLocalesOf", () =>
      JSON.stringify(Intl.NumberFormat.supportedLocalesOf(["de-DE", "ja", "en-GB", "en"])) === '["en-GB","en"]');

  // English and root data.
  check("en-US currency", () =>
      new Intl.NumberFormat("en-US", { style: "currency", currency: "EUR" }).format(1234.5) === "€1,234.50");
  check("en-GB date", () =>
      new Intl.DateTimeFormat("en-GB", { timeZone: "UTC" }).format(Date.UTC(2020, 0, 2)) === "02/01/2020");
  check("time zone name", () =>
      new Intl.DateTimeFormat("en-US", { timeZone: "Asia/Tokyo", timeZoneName: "long" }).format(0).endsWith("Japan Standard Time"));
  check("DisplayNames", () => new Intl.DisplayNames("en", { type: "region" }).of("DE") === "Germany"
      && new Intl.DisplayNames("en", { type: "language" }).of("de") === "German");
  check("PluralRules", () => new Intl.PluralRules("en").select(1) === "one" && new Intl.PluralRules("en", { type: "ordinal" }).select(2) === "two");
  check("RelativeTimeFormat", () => new Intl.RelativeTimeFormat("en").format(-1, "day") === "1 day ago");
  check("ListFormat", () => new Intl.ListFormat("en").format(["a", "b", "c"]) === "a, b, and c");
  check("units", () => new Intl.NumberFormat("en", { style: "unit", unit: "kilometer-per-hour" }).format(50) === "50 km/h");

  // Collation root.
  check("Collator", () => ["b", "B", "a", "ä"].sort(new Intl.Collator("en").compare).join("") === "aäbB");
  check("localeCompare", () => "a".localeCompare("B") < 0 && "résumé".localeCompare("resume", "de") > 0);

  // Segmentation: grapheme, word (with the Thai dictionary), sentence.
  const segments = (text, granularity, locale = "en") =>
      [...new Intl.Segmenter(locale, { granularity }).segment(text)].map(s => s.segment);
  check("graphemes", () => segments("e\u0301\u{1F44D}\u{1F3FD}\u{1F1FA}\u{1F1E6}", "grapheme").length === 3);
  check("words", () => JSON.stringify(segments("Hello, world", "word")) === '["Hello",","," ","world"]');
  check("Thai words", () => JSON.stringify(segments("สวัสดีครับ", "word", "th")) === '["สวัสดี","ครับ"]');
  check("sentences", () => segments("One. Two? Three!", "sentence").length === 3);

  // Normalization, case mapping, IDNA.
  check("NFKC", () => "\uFB01".normalize("NFKC") === "fi" && "e\u0301".normalize("NFC") === "\u00E9" && "\u00E9".normalize("NFD") === "e\u0301");
  check("case", () => "I".toLocaleLowerCase("tr") === "\u0131" && "i".toLocaleUpperCase("az") === "\u0130"
      && "\u03AC".toLocaleUpperCase("el") === "\u0391" && "stra\u00DFe".toUpperCase() === "STRASSE");
  check("IDNA", () => new URL("http://bücher.example/").hostname === "xn--bcher-kva.example");

  // Time zones for Temporal and Date.
  check("Temporal zones", () =>
      Temporal.Instant.from("2020-01-01T00:00Z").toZonedDateTimeISO("America/New_York").hour === 19
      && Temporal.ZonedDateTime.from("2021-03-28T01:30[Europe/Kyiv]").add({ hours: 2 }).offset === "+03:00");
  check("Date zone", () =>
      new Date(Date.UTC(2020, 6, 1, 12)).toLocaleString("en-US", { timeZone: "Europe/Berlin" }) === "7/1/2020, 2:00:00 PM");

  // text-transform: full-width maps through LibUnicode's table (no ICU transliterator data): ASCII,
  // space, Latin-1 symbols, halfwidth katakana composing with a following sound mark, halfwidth Hangul.
  check("full-width", () =>
      document.getElementById("fullwidth").getBoundingClientRect().width > document.getElementById("halfwidth").getBoundingClientRect().width * 1.3);
  check("full-width mapping", () =>
      Array.from(document.getElementById("fullwidth_mixed").innerText, c => c.codePointAt(0).toString(16)).join(" ") ===
      "ff21 3000 ff42 ffe5 30ac 30d1 30a2 1100 ff01");

  const result = document.getElementById("result");
  const title = failures.length ? "icu FAILED: " + failures.join(", ") : "icu ok";
  result.textContent = title;
  result.className = failures.length ? "" : "ok";
  document.title = title;
</script>
</body>
</html>
