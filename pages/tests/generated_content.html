<!doctype html>
<html>
<head>
  <style>
    li::before { content: "[before] "; color: rgb(190, 20, 20); }
    li::marker { color: rgb(20, 70, 190); }
  </style>
</head>
<body>
  <ul><li>unordered marker and generated prefix</li></ul>
  <ol><li>ordered marker and generated prefix</li></ol>
</body>
</html>
