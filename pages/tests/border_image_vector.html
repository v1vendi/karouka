<title>border-image vector sources</title>
<style>
  body { margin: 0; background: #e8e8e8; }
  div { position: absolute; box-sizing: content-box; width: 90px; height: 90px; border: 30px solid #f0f; border-image-slice: 30 fill; }
  .r1 { top: 20px; } .r2 { top: 200px; } .r3 { top: 380px; }
  .c1 { left: 20px; } .c2 { left: 210px; } .c3 { left: 400px; } .c4 { left: 590px; }
  /* An SVG with a natural size, 90x90, sliced at its 30px cells. */
  .svg { border-image-source: url(border_image_grid.svg); }
  /* An SVG with no natural size or ratio: the source takes the border image area (150x150), cut at its thirds. */
  .sizeless { border-image-source: url(border_image_grid_sizeless.svg); border-image-slice: 50 fill; }
  /* The same grid as a PNG: the raster path, beside the SVG ones. */
  .png { border-image-source: url(border_image_grid.png); }
  /* Gradients have no natural size either: the stripes run across the whole border image area. Here the slices
     scale by 2/3 (slice 30, border 20) and the tiles land on fractional pixels. */
  .gradient {
    width: 128px; height: 88px; border-width: 20px;
    border-image-source: linear-gradient(to right, #c00000 0 25%, #00a000 25% 50%, #0000c0 50% 75%, #c0c000 75%);
  }
  .stretch { border-image-repeat: stretch; }
  .round { border-image-repeat: round; }
  .space { border-image-repeat: space; width: 98px; height: 98px; }
  .outset { border-image-outset: 15px; border-image-repeat: repeat; border-image-slice: 30; }
</style>
</head>
<body>
<!-- border-image-source as vector content (SVG with and without a natural size) and as a gradient,
     under stretch, round, space and repeat. Each SVG cell and each edge half has its own colour, so a
     slice painted in the wrong place, transposed, mirrored or tiled wrongly shows. The SVG boxes keep
     every tile on whole pixels at whole scale ratios, so the player's cached rasters of the nested
     list match its direct replay and the software backend exactly. The pixels were read from
     Chrome's rendering of this page (headless, 800x600, scale 1). -->
<div class="svg stretch r1 c1"></div><div class="svg round r1 c2"></div><div class="svg space r1 c3"></div><div class="png round r1 c4"></div>
<div class="sizeless stretch r2 c1"></div><div class="svg outset r2 c2" style="left: 225px"></div>
<div class="gradient stretch r3 c1"></div><div class="gradient round r3 c2"></div><div class="gradient space r3 c3" style="width: 128px; height: 88px"></div><div class="gradient r3 c4" style="border-image-repeat: space round"></div>
</body>
