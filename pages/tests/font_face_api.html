<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="karouka-check-title" content="^url=loaded buffer=loaded check=true$">
<title>font face api</title>
<style>
  body { margin: 16px; background: #f6f8fa; color: #1f2328; font: 13px sans-serif; }
  p { margin: 0 0 10px; }
  .url { font-family: UrlFace, monospace; font-size: 15px; }
  .buffer { font-family: BufferFace, monospace; font-size: 14px; color: #0969da; }
  .big { font-size: 28px; }
</style>
</head>
<body>
<!-- Web fonts made through the CSS Font Loading API rather than @font-face. A FontFace from URLs
     loads through LibWeb's FontLoader, as @font-face does; one from a BufferSource parses its data
     itself (FontFace.cpp's load_vector_font). Patch 0075 tells the embedder about both typefaces,
     so with a shader cache karouka warms the glyphs an earlier run drew in them (WebFontGlyphs.cpp;
     KR_DEBUG logs "web font glyphs: 'KaroukaBoxes' ... made, N glyphs to warm" on a second run).
     The buffer is a 1.7 KB TrueType font, made for this page: 0-9 and A-F as boxes of distinct
     sizes. The title says both loaded and document.fonts.check() finds the buffer face. -->
<p class="url">FontFace from a URL: Noto Sans, loaded with load().</p>
<p class="url">The quick brown fox jumps over the lazy dog 0123456789</p>
<p class="buffer">0123456789ABCDEF FEDCBA9876543210</p>
<p class="buffer">C0FFEE 2B 1D A7 F00D BEEF 42</p>
<p class="buffer big">ACE 1F</p>

const url = new FontFace("UrlFace", "url(../fonts/NotoSans-Regular.ttf)");
const buffer = new FontFace("BufferFace", Uint8Array.from(atob(boxes), c => c.charCodeAt(0)));
document.fonts.add(url);
document.fonts.add(buffer);
Promise.all([url.load(), buffer.load()]).then(
  () => { document.title = `url=${url.status} buffer=${buffer.status} check=${document.fonts.check("14px BufferFace", "ACE")}`; },
  error => { document.title = `failed: ${error} url=${url.status} buffer=${buffer.status}`; });
