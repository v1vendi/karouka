<!doctype html>
<html>
<head>
<style>
  /* karouka's own. Arabic in each white-space mode, and numbers
     inside Arabic. Every Arabic line should read like the first: under
     nowrap and pre the letters used to come out in reverse order, and the
     digits of a number inside Arabic were reversed in every mode. Nothing
     compares the capture yet: look at it. Runs in different
     fonts or elements, reordered against each other on the line,
     are bidi_reorder.html, which checks itself. */
  @font-face { font-family: "Arabic"; src: url("../fonts/NotoSansArabic-Regular.ttf"); }
  body { margin: 8px; font: 24px "Arabic", sans-serif; background: white; color: black; }
  div { height: 36px; }
</style>
</head>
<body>
<div>normal: &#1605;&#1585;&#1581;&#1576;&#1575; &#1576;&#1603;&#1605;</div>
<div style="white-space: nowrap">nowrap: &#1605;&#1585;&#1581;&#1576;&#1575; &#1576;&#1603;&#1605;</div>
<div style="white-space: pre">pre: &#1605;&#1585;&#1581;&#1576;&#1575; &#1576;&#1603;&#1605;</div>
<div>arabic digits: &#1605;&#1585;&#1581;&#1576;&#1575; &#1635;&#1636;&#1637; &#1576;&#1603;&#1605;</div>
<div style="white-space: nowrap">european digits: &#1605;&#1585;&#1581;&#1576;&#1575; 12.50 &#1576;&#1603;&#1605;</div>
<div dir="rtl">&#1605;&#1585;&#1581;&#1576;&#1575; &#1576;&#1603;&#1605;</div>
</body>
</html>
